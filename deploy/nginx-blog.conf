# Production reverse proxy for the blog (Aliyun or any VPS with a public domain).
#
# Usage:
#   1. sudo cp deploy/nginx-blog.conf /etc/nginx/conf.d/blog.conf
#   2. Edit server_name below to your filed domain
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo apt-get install -y certbot python3-certbot-nginx
#      sudo certbot --nginx -d your.domain.com
#      certbot will add the 443 block, TLS certs and HTTPS redirect automatically,
#      and reuse the acme-challenge location here for renewals.
#
# If you use an Aliyun free DV cert instead of certbot, add a 443 server block by
# hand pointing ssl_certificate / ssl_certificate_key at the uploaded pem/key.

server {
    listen 80;
    server_name your.domain.com;

    # ACME http-01 challenges (certbot webroot style, also used by --nginx plugin)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Comment uploads and long Markdown posts
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
